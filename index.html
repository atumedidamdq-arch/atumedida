<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A TU MEDIDA · Lista de precios</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7EE;--card:#fff;--ink:#26331F;--muted:#6b7a5c;--green:#294D2B;--olive:#71834D;--beige:#F1E7D5;--brown:#B58B5B;--price:#294D2B;--line:#E6DCC6;--tag:#9A6F3F;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121c14;--card:#1b2a1e;--ink:#F1E7D5;--muted:#a9b59a;--beige:#25392a;--price:#E8C98F;--line:#2f4633;--tag:#D9B98C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121c14;--card:#1b2a1e;--ink:#F1E7D5;--muted:#a9b59a;--beige:#25392a;--price:#E8C98F;--line:#2f4633;--tag:#D9B98C;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{background:#294D2B;border-bottom:4px solid var(--brown);text-align:center;padding:18px 16px 14px;margin-top:calc(-1*env(safe-area-inset-top,0px));padding-top:calc(18px + env(safe-area-inset-top,0px))}
header img{max-width:100%;width:340px;height:auto}
header p{margin:6px 0 0;color:#E8C98F;font-size:.82rem;font-weight:500}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.wrap{max-width:720px;margin:0 auto}
.search{width:100%;font:inherit;font-size:1rem;padding:12px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.search:focus{border-color:var(--olive)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.8rem;font-weight:500;padding:7px 14px;border-radius:999px;border:1.5px solid var(--olive);background:transparent;color:var(--ink);cursor:pointer}
.chip.on{background:var(--green);border-color:var(--green);color:#FBF7EE}
.w{display:flex;align-items:center;gap:8px;padding-top:8px;font-size:.78rem;color:var(--muted)}
.w b{font-weight:600;color:var(--ink)}
.seg{display:flex;gap:6px}.seg button{font:inherit;font-size:.78rem;font-weight:600;padding:5px 11px;border-radius:8px;border:1.5px solid var(--brown);background:transparent;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--brown);color:#fff}
main{padding:14px 14px 110px}
h2{font-size:.95rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);margin:22px 0 8px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--brown)}
h2 small{margin-left:auto;font-weight:400;font-size:.72rem;color:var(--muted);text-transform:none;letter-spacing:0}
.list{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row:nth-child(even){background:var(--beige)}
.nm{flex:1;font-size:.92rem;font-weight:500;line-height:1.25}
.tag{display:inline-block;margin-left:6px;font-size:.68rem;font-weight:400;color:var(--tag);white-space:nowrap}
.pr{font-weight:700;color:var(--price);font-size:1rem;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:.9rem}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:0 14px 30px}
.wa{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;background:#25D366;color:#fff;text-decoration:none;font-weight:600;font-size:.9rem;padding:13px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.wa svg{width:22px;height:22px;fill:#fff}
</style></head><body>
